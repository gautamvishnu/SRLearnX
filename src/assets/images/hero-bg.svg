<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="1200" height="600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3f51b5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#303f9f;stop-opacity:1" />
    </linearGradient>
    <pattern id="pattern1" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="2" fill="rgba(255, 255, 255, 0.2)" />
    </pattern>
  </defs>
  
  <rect width="1200" height="600" fill="url(#grad1)" />
  <rect width="1200" height="600" fill="url(#pattern1)" />
  
  <!-- Abstract code elements -->
  <g opacity="0.3">
    <text x="100" y="100" font-family="monospace" font-size="14" fill="white">&lt;html&gt;</text>
    <text x="120" y="120" font-family="monospace" font-size="14" fill="white">&lt;head&gt;</text>
    <text x="140" y="140" font-family="monospace" font-size="14" fill="white">&lt;title&gt;Learn to Code&lt;/title&gt;</text>
    <text x="120" y="160" font-family="monospace" font-size="14" fill="white">&lt;/head&gt;</text>
    <text x="120" y="180" font-family="monospace" font-size="14" fill="white">&lt;body&gt;</text>
    <text x="140" y="200" font-family="monospace" font-size="14" fill="white">&lt;h1&gt;Welcome to SRLearnX&lt;/h1&gt;</text>
    <text x="140" y="220" font-family="monospace" font-size="14" fill="white">&lt;p&gt;Learn coding with us!&lt;/p&gt;</text>
    <text x="120" y="240" font-family="monospace" font-size="14" fill="white">&lt;/body&gt;</text>
    <text x="100" y="260" font-family="monospace" font-size="14" fill="white">&lt;/html&gt;</text>
    
    <text x="800" y="150" font-family="monospace" font-size="14" fill="white">function learnToCode() {</text>
    <text x="820" y="170" font-family="monospace" font-size="14" fill="white">const skills = [];</text>
    <text x="820" y="190" font-family="monospace" font-size="14" fill="white">skills.push('HTML');</text>
    <text x="820" y="210" font-family="monospace" font-size="14" fill="white">skills.push('CSS');</text>
    <text x="820" y="230" font-family="monospace" font-size="14" fill="white">skills.push('JavaScript');</text>
    <text x="820" y="250" font-family="monospace" font-size="14" fill="white">return skills;</text>
    <text x="800" y="270" font-family="monospace" font-size="14" fill="white">}</text>
    
    <text x="300" y="350" font-family="monospace" font-size="14" fill="white">.container {</text>
    <text x="320" y="370" font-family="monospace" font-size="14" fill="white">display: flex;</text>
    <text x="320" y="390" font-family="monospace" font-size="14" fill="white">justify-content: center;</text>
    <text x="320" y="410" font-family="monospace" font-size="14" fill="white">align-items: center;</text>
    <text x="320" y="430" font-family="monospace" font-size="14" fill="white">height: 100vh;</text>
    <text x="300" y="450" font-family="monospace" font-size="14" fill="white">}</text>
    
    <text x="600" y="400" font-family="monospace" font-size="14" fill="white">import { Component } from '@angular/core';</text>
    <text x="600" y="420" font-family="monospace" font-size="14" fill="white">@Component({</text>
    <text x="620" y="440" font-family="monospace" font-size="14" fill="white">selector: 'app-root',</text>
    <text x="620" y="460" font-family="monospace" font-size="14" fill="white">templateUrl: './app.component.html'</text>
    <text x="600" y="480" font-family="monospace" font-size="14" fill="white">})</text>
    <text x="600" y="500" font-family="monospace" font-size="14" fill="white">export class AppComponent {</text>
    <text x="620" y="520" font-family="monospace" font-size="14" fill="white">title = 'SRLearnX';</text>
    <text x="600" y="540" font-family="monospace" font-size="14" fill="white">}</text>
  </g>
</svg>
