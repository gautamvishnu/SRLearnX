<div class="signup-container">
  <div class="signup-card">
    <div class="signup-header">
      <h2>Create an Account</h2>
      <p>Join SRLearnX to access premium courses and learning resources</p>
    </div>

    <div class="signup-form">
      <div class="form-group">
        <label for="name">Full Name</label>
        <input type="text" id="name" name="name" [(ngModel)]="name" placeholder="Enter your full name" required>
      </div>

      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" [(ngModel)]="email" placeholder="Enter your email address" required>
      </div>

      <div class="form-group">
        <label for="mobile">Mobile Number</label>
        <input type="tel" id="mobile" name="mobile" [(ngModel)]="mobile" placeholder="Enter your 10-digit mobile number"
          maxlength="10" required>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" [(ngModel)]="password"
          placeholder="Create a password (min. 6 characters)" required>
      </div>

      <div class="form-group">
        <label for="confirmPassword">Confirm Password</label>
        <input type="password" id="confirmPassword" name="confirmPassword" [(ngModel)]="confirmPassword"
          placeholder="Confirm your password" required>
      </div>

      <div class="terms-checkbox">
        <input type="checkbox" id="terms" name="terms" [(ngModel)]="acceptTerms">
        <label for="terms">
          I agree to the <a routerLink="/terms-conditions">Terms and Conditions</a> and <a
            routerLink="/privacy-policy">Privacy Policy</a>
        </label>
      </div>

      <button class="btn btn-primary register-btn" (click)="register()"
        [disabled]="!name || !email || !mobile || !password || !confirmPassword || !acceptTerms">
        Create Account
      </button>

      <div class="login-link">
        <p>Already have an account? <a routerLink="/login">Login</a></p>
      </div>
    </div>
  </div>
</div>
