<header class="header" [ngClass]="{ scrolled: isScrolled }">
  <div class="header-top">
    <div class="container">
      <div class="header-top-left">
        <a href="mailto:education@srlearnx.com" class="header-contact">
          <i class="fas fa-envelope"></i> education&#64;srlearnx.com
        </a>
        <a href="tel:+911204369986" class="header-contact">
          <i class="fas fa-phone-alt"></i> +91 120 4369986
        </a>
      </div>
      <div class="header-top-right">
        <div class="social-links">
          <!-- <a href="#" aria-label="Facebook"
            ><i class="fab fa-facebook-f"></i
          ></a> -->
          <!-- <a href="#" aria-label="Twitter"><i class="fab fa-twitter"></i></a> -->
          <a href="https://www.youtube.com/@SRLearnX_education/" target="_blank" aria-label="YouTube"><i
              class="fab fa-youtube"></i></a>
          <a href="https://www.instagram.com/SRLearnX.education/" target="_blank" aria-label="Instagram"><i
              class="fab fa-instagram"></i></a>
          <a href="https://www.linkedin.com/in/SRLearnX-education-a14b2037b/" target="_blank" aria-label="LinkedIn"><i
              class="fab fa-linkedin-in"></i></a>
        </div>
      </div>
    </div>
  </div>

  <div class="header-main">
    <div class="container">
      <div class="logo">
        <a routerLink="/">
          <h1>
            <span class="logo-edu">SR</span><span class="logo-seva">LearnX</span>
          </h1>
        </a>
        A UNIT OF SR TECH N SERVE PRIVATE LIMITED
      </div>

      <button class="mobile-menu-toggle" (click)="toggleMobileMenu()" aria-label="Toggle menu">
        <i class="fas" [ngClass]="{
            'fa-bars': !isMobileMenuOpen,
            'fa-times': isMobileMenuOpen
          }"></i>
      </button>

      <nav class="nav" [ngClass]="{ 'nav-open': isMobileMenuOpen }">
        <ul>
          <li>
            <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Home</a>
          </li>
          <li>
            <a routerLink="/courses" routerLinkActive="active">Courses</a>
          </li>
          <li><a routerLink="/about" routerLinkActive="active">About Us</a></li>
          <li>
            <a routerLink="/contact" routerLinkActive="active">Contact</a>
          </li>
          <li><a routerLink="/career" routerLinkActive="active">Career</a></li>
          <li><a routerLink="/blog" routerLinkActive="active">Blog</a></li>
        </ul>
      </nav>

      <div class="header-actions">
        <div class="cart">
          <a routerLink="/cart" class="cart-link" aria-label="Shopping cart">
            <i class="fas fa-shopping-cart"></i>
            <span class="cart-count" *ngIf="cartService.getCartItemCount() > 0">{{ cartService.getCartItemCount()
              }}</span>
          </a>
        </div>

        <!-- <a routerLink="/login" class="btn btn-outline-primary login-btn">Login</a>
        <a routerLink="/signup" class="btn btn-primary register-btn">Register</a> -->
      </div>
    </div>
  </div>
</header>
